<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AstraFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .form-input {
            transition: all 0.2s;
        }

        .form-input:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
    </style>
</head>

<body class="bg-indigo-50/30 overflow-hidden">
    <!-- Background Decor -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 opacity-40 pointer-events-none">
        <div class="absolute top-[20%] left-[10%] w-[50%] h-[50%] bg-purple-200/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[20%] right-[10%] w-[40%] h-[40%] bg-indigo-200/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20 shrink-0">
            <!-- User Section -->
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center space-x-3 mb-4">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-lg font-bold shadow-lg shadow-indigo-500/30">
                        AF</div>
                    <span class="text-xl font-bold tracking-tight">AstraFlow</span>
                </div>
                <div class="bg-slate-800/50 rounded-xl p-3 flex items-center space-x-3 border border-slate-700/50">
                    <div
                        class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 flex items-center justify-center text-xs font-bold">
                        U</div>
                    <div>
                        <div class="font-medium text-sm text-slate-200" id="userName">User</div>
                        <div class="text-xs text-slate-500">Admin Workspace</div>
                    </div>
                </div>
            </div>

            <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Menu</div>

                <a href="/"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">🏠</span>
                    <span class="font-medium">Home</span>
                </a>
                <a href="/dashboard"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">📊</span>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="/collections"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">📚</span>
                    <span class="font-medium">Collections</span>
                </a>
                <a href="/workspace"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">💼</span>
                    <span class="font-medium">Workspace</span>
                </a>
                <a href="/chat"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">💭</span>
                    <span class="font-medium">Chat</span>
                </a>
                <a href="/workflows"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">⚙️</span>
                    <span class="font-medium">Workflows</span>
                </a>
                <a href="/stocks"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">📈</span>
                    <span class="font-medium">Stocks</span>
                </a>
                <a href="/github-docs"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">🚀</span>
                    <span class="font-medium">GitHub Docs</span>
                </a>
            </nav>

            <div class="px-6 py-4">
                <a href="/settings"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-900/20 group mb-2">
                    <span class="group-hover:scale-110 transition-transform duration-200">⚙️</span>
                    <span class="font-medium">Settings</span>
                </a>
                <button onclick="logout()"
                    class="w-full flex items-center space-x-3 px-4 py-2 rounded-lg text-red-500 hover:bg-red-500/10 hover:text-red-400 text-sm transition-colors">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
                <div class="text-xs text-slate-600 mt-2 font-medium tracking-wide text-center" id="sidebarDate"></div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto custom-scrollbar relative z-10">
            <div class="p-8 max-w-5xl mx-auto">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Settings</h1>
                <p class="text-slate-500 mb-10">Manage your account, preferences, and integrations.</p>

                <div class="flex flex-col md:flex-row gap-8">
                    <!-- Tabs -->
                    <div class="w-full md:w-64 shrink-0">
                        <div class="glass-card rounded-2xl p-2 shadow-sm sticky top-8">
                            <nav class="space-y-1" id="tabsNav"></nav>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="flex-1 min-w-0 pb-10" id="tabContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '/login';
            }
        }

        let currentUser = null;

        // Load user profile
        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('http://localhost:8080/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    currentUser = user;

                    // Update sidebar
                    const userNameElement = document.getElementById('userName');
                    if (userNameElement) {
                        const name = user.first_name ? `${user.first_name} ${user.last_name || ''}` : user.email.split('@')[0];
                        userNameElement.textContent = name;
                    }

                    // Re-render content if needed to update inputs
                    if (activeTab === 'general') {
                        renderContent();
                    }
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }
        }

        async function updateProfile() {
            try {
                const token = localStorage.getItem('token');
                if (!token) return;

                const firstName = document.getElementById('firstNameInput').value;
                const lastName = document.getElementById('lastNameInput').value;
                const button = document.getElementById('saveButton');

                // Loading state
                const originalText = button.textContent;
                button.textContent = 'Saving...';
                button.disabled = true;
                button.classList.add('opacity-75');

                const response = await fetch('http://localhost:8080/api/user/profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                if (response.ok) {
                    alert('Profile updated successfully!');
                    loadUserProfile(); // Reload to update sidebar
                } else {
                    const data = await response.json();
                    alert('Failed to update profile: ' + (data.detail || 'Unknown error'));
                }

                // Reset state
                button.textContent = originalText;
                button.disabled = false;
                button.classList.remove('opacity-75');

            } catch (error) {
                console.error('Error updating profile:', error);
                alert('An error occurred while updating profile');
                document.getElementById('saveButton').textContent = 'Save Changes';
                document.getElementById('saveButton').disabled = false;
            }
        }

        // Set current date
        const currentDate = new Date();
        const dateStr = currentDate.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric'
        });
        document.getElementById('sidebarDate').textContent = dateStr;

        const tabs = [
            { id: 'general', label: 'General', icon: '⚙️' },
            { id: 'models', label: 'AI Models', icon: '🤖' },
            { id: 'integrations', label: 'Integrations', icon: '🔌' },
            { id: 'billing', label: 'Billing', icon: '💳' }
        ];

        let activeTab = 'general';

        function renderTabs() {
            const nav = document.getElementById('tabsNav');
            nav.innerHTML = tabs.map(tab => `
                <button onclick="switchTab('${tab.id}')" 
                    class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-left transition-all ${activeTab === tab.id ? 'bg-indigo-50 text-indigo-600 font-bold shadow-sm' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900 font-medium'
                }">
                    <span class="text-xl">${tab.icon}</span>
                    <span class="text-sm">${tab.label}</span>
                </button>
            `).join('');
        }

        function renderContent() {
            const content = document.getElementById('tabContent');

            if (activeTab === 'general') {
                const firstName = currentUser ? (currentUser.first_name || '') : '';
                const lastName = currentUser ? (currentUser.last_name || '') : '';
                const email = currentUser ? currentUser.email : 'user@astraflow.ai';

                content.innerHTML = `
                    <div class="space-y-6 animation-fade-in">
                        <div class="glass-card rounded-2xl shadow-sm p-8">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg text-lg">👤</span> Personal Information
                            </h2>
                            <div class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">First Name</label>
                                        <input type="text" id="firstNameInput" value="${firstName}" 
                                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white form-input text-slate-900 placeholder-slate-400">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">Last Name</label>
                                        <input type="text" id="lastNameInput" value="${lastName}" 
                                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white form-input text-slate-900 placeholder-slate-400">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                                    <input type="email" value="${email}" 
                                        class="w-full px-4 py-3 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed" disabled>
                                    <p class="text-xs text-slate-400 mt-2">Email address cannot be changed.</p>
                                </div>
                            </div>
                            
                            <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                                <button id="saveButton" onclick="updateProfile()" 
                                    class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all">
                                    Save Changes
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'models') {
                content.innerHTML = `
                    <div class="space-y-6 animation-fade-in">
                        <div class="glass-card rounded-2xl shadow-sm p-8">
                             <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg text-lg">🔑</span> API Keys
                            </h2>
                            <p class="text-sm text-slate-500 mb-6">Manage your API keys to connect with various AI providers securely.</p>
                            
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">OpenAI API Key</label>
                                    <input type="password" placeholder="sk-..." 
                                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white form-input">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Google AI API Key</label>
                                    <input type="password" placeholder="AIza..." 
                                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white form-input">
                                </div>
                                <div>
                                     <label class="block text-sm font-semibold text-slate-700 mb-2">Anthropic API Key</label>
                                    <input type="password" placeholder="sk-ant..." 
                                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white form-input">
                                </div>
                            </div>
                            
                            <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                                <button class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all">
                                    Update Keys
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'integrations') {
                content.innerHTML = `
                    <div class="space-y-6 animation-fade-in">
                        <div class="glass-card rounded-2xl shadow-sm p-8">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg text-lg">🔌</span> Connected Services
                            </h2>
                            <div class="space-y-4">
                                ${['Kafka', 'MinIO', 'ChromaDB', 'Celery'].map((service, i) => `
                                    <div class="flex items-center justify-between p-4 bg-white border border-slate-100 rounded-xl hover:shadow-md transition-all group">
                                        <div class="flex items-center space-x-4">
                                            <div class="w-12 h-12 bg-slate-50 rounded-lg flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                                                ${['📡', '🗄️', '🔍', '⚙️'][i]}
                                            </div>
                                            <div>
                                                <div class="font-bold text-slate-900 text-sm">${service}</div>
                                                <div class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Connected
                                                </div>
                                            </div>
                                        </div>
                                        <button class="px-3 py-1.5 text-xs text-slate-500 font-medium hover:bg-slate-100 rounded-lg border border-transparent hover:border-slate-200 transition-all">Configure</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'billing') {
                content.innerHTML = `
                    <div class="space-y-6 animation-fade-in">
                        <div class="glass-card rounded-2xl shadow-sm p-8">
                             <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg text-lg">💳</span> Current Usage
                            </h2>
                            
                            <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white mb-6 shadow-xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500 rounded-full blur-[100px] opacity-20 transform translate-x-1/2 -translate-y-1/2"></div>
                                
                                <div class="flex items-center justify-between relative z-10">
                                    <div>
                                        <div class="text-sm text-slate-400 font-medium mb-1">Current Plan</div>
                                        <div class="text-2xl font-bold">Pro Plan</div>
                                    </div>
                                    <span class="px-3 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full text-xs font-bold uppercase tracking-wide">Active</span>
                                </div>
                                
                                <div class="mt-8 pt-6 border-t border-slate-700/50 flex justify-between items-end relative z-10">
                                     <div>
                                        <div class="text-sm text-slate-400 font-medium mb-1">Estimated Cost</div>
                                        <div class="text-3xl font-bold">$0.00</div>
                                    </div>
                                    <div class="text-right">
                                         <div class="text-xs text-slate-400 mb-1">Billing Period</div>
                                        <div class="text-sm font-medium">Dec 1 - Dec 31</div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                                <div class="flex items-center gap-3">
                                   <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">⚡️</div>
                                   <div>
                                       <div class="text-sm font-bold text-slate-800">Total API Calls</div>
                                       <div class="text-xs text-slate-500">Usage this month</div>
                                   </div>
                                </div>
                                <div class="text-lg font-bold text-slate-900">0</div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function switchTab(tabId) {
            activeTab = tabId;
            renderTabs();
            renderContent();
        }

        renderTabs();
        renderContent();
        loadUserProfile();
    </script>
</body>

</html>
