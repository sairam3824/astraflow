<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - AstraFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        .message-user {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-bottom-right-radius: 0;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
        }

        .message-ai {
            background: white;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            border-bottom-left-radius: 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .message-system {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            color: #92400e;
        }
    </style>
</head>

<body class="bg-indigo-50/30 overflow-hidden">
    <!-- Background Decor -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 opacity-40 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-indigo-200/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-200/20 rounded-full blur-[120px]">
        </div>
    </div>

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20 shrink-0">
            <!-- User Section -->
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center space-x-3 mb-4">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-lg font-bold shadow-lg shadow-indigo-500/30">
                        AF</div>
                    <span class="text-xl font-bold tracking-tight">AstraFlow</span>
                </div>
                <div class="bg-slate-800/50 rounded-xl p-3 flex items-center space-x-3 border border-slate-700/50">
                    <div
                        class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 flex items-center justify-center text-xs font-bold">
                        U</div>
                    <div>
                        <div class="font-medium text-sm text-slate-200" id="userName">User</div>
                        <div class="text-xs text-slate-500">Admin Workspace</div>
                    </div>
                </div>
            </div>

            <!-- Main Navigation -->
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Menu</div>

                <a href="/"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">🏠</span>
                    <span class="font-medium">Home</span>
                </a>
                <a href="/dashboard"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">📊</span>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="/collections"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">📚</span>
                    <span class="font-medium">Collections</span>
                </a>
                <a href="/workspace"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">💼</span>
                    <span class="font-medium">Workspace</span>
                </a>
                <a href="/chat"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-900/20 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">💭</span>
                    <span class="font-medium">Chat</span>
                </a>
                <a href="/workflows"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">⚙️</span>
                    <span class="font-medium">Workflows</span>
                </a>
                <a href="/stocks"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">📈</span>
                    <span class="font-medium">Stocks</span>
                </a>
                <a href="/github-docs"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 group">
                    <span class="group-hover:scale-110 transition-transform duration-200">🚀</span>
                    <span class="font-medium">GitHub Docs</span>
                </a>
            </nav>

            <div class="px-6 py-4">
                <button onclick="logout()"
                    class="w-full flex items-center space-x-3 px-4 py-2 rounded-lg text-red-500 hover:bg-red-500/10 hover:text-red-400 text-sm transition-colors">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
                <div class="text-xs text-slate-600 mt-2 font-medium tracking-wide text-center" id="sidebarDate"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative bg-slate-50/50">
            <!-- Header -->
            <div class="glass-panel px-6 py-4 z-10 sticky top-0">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div
                            class="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600">
                            <span class="text-xl">💭</span>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-slate-900 leading-tight">AI Chat</h1>
                            <p class="text-xs text-slate-500 font-medium">Powered by advanced LLMs</p>
                        </div>
                    </div>
                    <button onclick="showNewChatModal()"
                        class="px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 text-sm font-semibold shadow-lg shadow-slate-900/20 transition-all hover:-translate-y-0.5">
                        + New Chat
                    </button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar pb-32">
                <!-- Messages injected here -->
            </div>

            <!-- Input Area -->
            <div
                class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-white via-white to-transparent pt-20">
                <div
                    class="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl shadow-indigo-100/50 border border-slate-100 p-2 flex items-center gap-2 relative z-20">
                    <div class="relative group">
                        <select id="activeModelSelect" onchange="changeModel()"
                            class="appearance-none pl-3 pr-8 py-2.5 bg-slate-50 border border-transparent hover:border-slate-200 rounded-xl text-xs font-bold text-slate-700 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            <option value="gpt-4">GPT-4</option>
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                            <option value="gemini-pro">Gemini Pro</option>
                            <option value="claude-3">Claude 3</option>
                            <option value="llama-2">Llama 2</option>
                        </select>
                        <div class="absolute right-2 top-3 pointer-events-none text-slate-400 text-[10px]">▼</div>
                    </div>

                    <div class="w-px h-6 bg-slate-200 mx-1"></div>

                    <textarea id="messageInput" placeholder="Type your message..."
                        class="flex-1 py-3 px-2 bg-transparent border-none focus:ring-0 text-slate-700 placeholder-slate-400 text-sm resize-none"
                        rows="1" style="min-height: 24px; max-height: 120px;"
                        oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"
                        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>

                    <button onclick="sendMessage()" id="sendButton"
                        class="p-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-500/30 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <p class="text-[10px] text-slate-400 font-medium">AI can make mistakes. Please verify important
                        information.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- New Chat Modal -->
    <div id="newChatModal"
        class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-all scale-100">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Start New Chat</h2>
                <button onclick="hideNewChatModal()"
                    class="text-slate-400 hover:text-slate-600 transition-colors">✕</button>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">AI Model</label>
                    <div class="relative">
                        <select id="modelSelect"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none font-medium text-slate-700">
                            <option value="gpt-4">GPT-4 (OpenAI)</option>
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo (OpenAI)</option>
                            <option value="gemini-pro">Gemini Pro (Google)</option>
                            <option value="claude-3">Claude 3 (Anthropic)</option>
                            <option value="llama-2">Llama 2 (Meta)</option>
                        </select>
                        <div class="absolute right-4 top-4 pointer-events-none text-slate-400">▼</div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Collection <span
                            class="text-slate-400 font-normal">(Optional)</span></label>
                    <div class="relative">
                        <select id="collectionSelect"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none font-medium text-slate-700">
                            <option value="">None (General chat)</option>
                        </select>
                        <div class="absolute right-4 top-4 pointer-events-none text-slate-400">▼</div>
                    </div>
                </div>

                <div class="flex gap-3 mt-8 pt-4">
                    <button onclick="hideNewChatModal()"
                        class="flex-1 px-4 py-3 border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition-all">
                        Cancel
                    </button>
                    <button onclick="createChatSession()"
                        class="flex-1 px-4 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all">
                        Start Chat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set current date
        const currentDate = new Date();
        const dateStr = currentDate.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric'
        });
        document.getElementById('sidebarDate').textContent = dateStr;

        let currentSessionId = null;
        let currentModel = null;
        let collections = [];

        async function loadCollections() {
            try {
                const token = localStorage.getItem('token');
                if (!token) return;

                const response = await fetch('http://localhost:8080/api/collections', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    collections = await response.json();
                    const select = document.getElementById('collectionSelect');
                    select.innerHTML = '<option value="">None (General chat)</option>' +
                        collections.map(col => `<option value="${col.id}">${col.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Error loading collections:', error);
            }
        }

        function showNewChatModal() {
            document.getElementById('newChatModal').classList.remove('hidden');
        }

        function hideNewChatModal() {
            document.getElementById('newChatModal').classList.add('hidden');
        }

        async function createChatSession() {
            const model = document.getElementById('modelSelect').value;
            const collectionId = document.getElementById('collectionSelect').value || null;

            try {
                const token = localStorage.getItem('token');

                if (!token) {
                    alert('Please login first');
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('http://localhost:8080/api/chat/sessions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model, collection_id: collectionId })
                });

                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    window.location.href = '/login';
                    return;
                }

                const session = await response.json();
                currentSessionId = session.id;
                currentModel = model;

                // Update model selector value
                document.getElementById('activeModelSelect').value = model;

                // Clear messages and show welcome message
                document.getElementById('chatMessages').innerHTML = '';

                // Get user name from the page
                const userName = document.getElementById('userName').textContent || 'there';
                addMessageToUI('assistant', `Hi ${userName}! I'm ready to help. What's on your mind?`);

                hideNewChatModal();

                // Enable input and button
                const input = document.getElementById('messageInput');
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.placeholder = 'Type your message...';
                input.focus();
            } catch (error) {
                console.error('Error creating chat session:', error);
                alert('Error creating chat session');
            }
        }

        async function sendMessage() {
            if (!currentSessionId) {
                showNewChatModal();
                return;
            }

            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content) return;

            // Add user message to UI
            addMessageToUI('user', content);
            input.value = '';
            input.style.height = 'auto'; // Reset height

            try {
                const token = localStorage.getItem('token');

                // Show thinking
                const thinkingId = 'thinking-' + Date.now();
                const container = document.getElementById('chatMessages');

                const thinkingDiv = document.createElement('div');
                thinkingDiv.id = thinkingId;
                thinkingDiv.className = 'flex justify-start animation-fade-in';
                thinkingDiv.innerHTML = `
                      <div class="message-ai rounded-2xl p-4 flex items-center space-x-2 rounded-bl-none">
                            <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                            <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                      </div>
                `;
                container.appendChild(thinkingDiv);
                container.scrollTop = container.scrollHeight;

                const response = await fetch(`http://localhost:8080/api/chat/sessions/${currentSessionId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });

                document.getElementById(thinkingId).remove();
                const message = await response.json();

                // Add AI response to UI
                addMessageToUI('assistant', message.content);

            } catch (error) {
                console.error('Error sending message:', error);
                document.getElementById('thinking-' + Date.now())?.remove();
                addMessageToUI('system', 'Error sending message. Please try again.');
            }
        }

        function addMessageToUI(role, content) {
            const container = document.getElementById('chatMessages');

            // Remove empty state if present
            if (container.querySelector('.text-center')) {
                container.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex w-full mb-4 animation-fade-in';

            if (role === 'user') {
                messageDiv.innerHTML = `
                    <div class="flex-1"></div>
                    <div class="max-w-[80%]">
                        <div class="message-user rounded-2xl p-4 text-sm shadow-md">
                            ${content}
                        </div>
                    </div>
                `;
            } else if (role === 'assistant') {
                messageDiv.innerHTML = `
                    <div class="max-w-[80%] flex items-end gap-2">
                        <div class="w-6 h-6 rounded-lg bg-indigo-100 flex items-center justify-center text-xs mb-1 shrink-0">🤖</div>
                        <div class="message-ai rounded-2xl p-4 text-sm text-slate-700 leading-relaxed shadow-sm">
                            ${content}
                        </div>
                    </div>
                    <div class="flex-1"></div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="w-full flex justify-center my-2">
                        <div class="message-system rounded-xl px-4 py-2 text-xs font-medium shadow-sm">
                            ${content}
                        </div>
                    </div>
                `;
            }

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function changeModel() {
            if (!currentSessionId) return;

            const newModel = document.getElementById('activeModelSelect').value;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`http://localhost:8080/api/chat/sessions/${currentSessionId}/model`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model: newModel })
                });

                if (response.ok) {
                    currentModel = newModel;
                    addMessageToUI('system', `Model changed to ${newModel}`);
                } else {
                    alert('Failed to change model');
                    document.getElementById('activeModelSelect').value = currentModel;
                }
            } catch (error) {
                console.error('Error changing model:', error);
                document.getElementById('activeModelSelect').value = currentModel;
            }
        }

        // Show welcome message on page load
        function showWelcomeMessage() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center p-8 opacity-60">
                    <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center text-4xl mb-6 text-indigo-300">
                        💬
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Welcome to AI Chat</h2>
                    <p class="text-slate-500 mb-8 max-w-sm mx-auto">Start a conversation with advanced AI models. Ask questions, generate content, or chat about your documents.</p>
                    
                    <button onclick="showNewChatModal()" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 hover:-translate-y-1 transition-all">
                        Start New Conversation
                    </button>
                    
                    <div class="mt-12 grid grid-cols-3 gap-4 text-left max-w-lg w-full">
                        <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                            <div class="text-lg mb-1">🧠</div>
                            <div class="text-xs font-bold text-slate-700">Smart Models</div>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                            <div class="text-lg mb-1">📚</div>
                            <div class="text-xs font-bold text-slate-700">Doc Chat</div>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                            <div class="text-lg mb-1">⚡️</div>
                            <div class="text-xs font-bold text-slate-700">Fast</div>
                        </div>
                    </div>
                </div>
            `;

            // Disable input until session is created
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendButton').disabled = true;
        }

        // Load user profile
        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('token');
                if (!token) return;

                const response = await fetch('http://localhost:8080/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    if (user.first_name && user.last_name) {
                        document.getElementById('userName').textContent = `${user.first_name} ${user.last_name}`;
                    } else if (user.first_name) {
                        document.getElementById('userName').textContent = user.first_name;
                    } else {
                        document.getElementById('userName').textContent = user.email.split('@')[0];
                    }
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }
        }

        // Check authentication on page load
        function checkAuth() { // Simplified for this view, real auth check happens on API calls usually
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        if (checkAuth()) {
            loadUserProfile();
            loadCollections();
            showWelcomeMessage();
        }
    </script>
</body>

</html>
