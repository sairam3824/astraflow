<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AstraFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>

<body class="bg-indigo-900 overflow-hidden">
    <!-- Background Animation -->
    <div class="fixed top-0 left-0 w-full h-full -z-10">
        <div
            class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-500/30 rounded-full blur-[120px] animate-float">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500/30 rounded-full blur-[120px] animate-float"
            style="animation-delay: 2s;"></div>
        <div class="absolute top-[40%] left-[40%] w-[30%] h-[30%] bg-pink-500/20 rounded-full blur-[100px] animate-float"
            style="animation-delay: 4s;"></div>

        <!-- Grid Pattern Overlay -->
        <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
    </div>

    <div class="min-h-screen flex items-center justify-center p-4">
        <div
            class="glass-card rounded-3xl shadow-2xl p-10 max-w-lg w-full relative overflow-hidden transition-all duration-500 hover:shadow-indigo-500/30 hover:scale-[1.01]">

            <!-- Top Brand -->
            <div class="text-center mb-10">
                <div
                    class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 items-center justify-center text-3xl shadow-lg shadow-indigo-500/30 mb-6 text-white font-bold">
                    AF</div>
                <h1 class="text-3xl font-bold text-slate-900 mb-2 tracking-tight">Welcome to <span
                        class="gradient-text">AstraFlow</span></h1>
                <p class="text-slate-500 font-medium">Your Intelligence Platform</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex p-1 bg-slate-100 rounded-xl mb-8 relative">
                <div id="tabIndicator"
                    class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded-lg shadow-sm transition-all duration-300 ease-in-out transform translate-x-1">
                </div>
                <button onclick="switchTab('login')" id="loginTab"
                    class="flex-1 py-2.5 text-center text-sm font-bold relative z-10 transition-colors text-slate-800">
                    Sign In
                </button>
                <button onclick="switchTab('register')" id="registerTab"
                    class="flex-1 py-2.5 text-center text-sm font-bold relative z-10 transition-colors text-slate-500">
                    Create Account
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="transition-all duration-300">
                <div class="space-y-5">
                    <div class="group">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Email
                            Address</label>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-indigo-600 transition-colors">✉️</span>
                            <input type="email" id="loginEmail"
                                class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium text-slate-800"
                                placeholder="name@company.com">
                        </div>
                    </div>
                    <div class="group">
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Password</label>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-indigo-600 transition-colors">🔒</span>
                            <input type="password" id="loginPassword"
                                class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium text-slate-800"
                                placeholder="••••••••" onkeypress="if(event.key === 'Enter') login()">
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox"
                                class="w-4 h-4 rounded text-indigo-600 border-gray-300 focus:ring-indigo-500">
                            <span class="text-slate-500 font-medium">Remember me</span>
                        </label>
                        <a href="#" class="text-indigo-600 font-bold hover:text-indigo-800">Forgot Password?</a>
                    </div>

                    <button onclick="login()"
                        class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold text-lg shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:scale-[1.02] transition-all duration-200 relative overflow-hidden group">
                        <span class="relative z-10">Sign In</span>
                        <div
                            class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                        </div>
                    </button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="hidden transition-all duration-300">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="group">
                            <label
                                class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">First
                                Name</label>
                            <input type="text" id="registerFirstName"
                                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                                placeholder="Jane">
                        </div>
                        <div class="group">
                            <label
                                class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Last
                                Name</label>
                            <input type="text" id="registerLastName"
                                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                                placeholder="Doe">
                        </div>
                    </div>
                    <div class="group">
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Email</label>
                        <input type="email" id="registerEmail"
                            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                            placeholder="name@company.com">
                    </div>
                    <div class="group">
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Password</label>
                        <input type="password" id="registerPassword"
                            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                            placeholder="At least 6 characters">
                    </div>
                    <div class="group">
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Confirm</label>
                        <input type="password" id="registerPasswordConfirm"
                            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                            placeholder="Repeat password" onkeypress="if(event.key === 'Enter') register()">
                    </div>

                    <button onclick="register()"
                        class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl font-bold text-lg shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 hover:scale-[1.02] transition-all duration-200 mt-2">
                        Create Account
                    </button>
                </div>
            </div>

            <div id="message" class="mt-6 p-4 rounded-xl hidden text-center text-sm font-medium animate-fade-in border">
            </div>

            <div class="mt-8 text-center text-xs text-slate-400">
                By continuing, you agree to our <a href="#" class="underline hover:text-slate-600">Terms of Service</a>
                & <a href="#" class="underline hover:text-slate-600">Privacy Policy</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const indicator = document.getElementById('tabIndicator');
            const loginBtn = document.getElementById('loginTab');
            const registerBtn = document.getElementById('registerTab');
            const message = document.getElementById('message');

            message.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');

                indicator.classList.remove('translate-x-full');
                indicator.classList.add('translate-x-1');

                loginBtn.classList.remove('text-slate-500');
                loginBtn.classList.add('text-slate-800');
                registerBtn.classList.add('text-slate-500');
                registerBtn.classList.remove('text-slate-800');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');

                indicator.classList.remove('translate-x-1');
                indicator.classList.add('translate-x-[102%]'); // Adjust for gap

                registerBtn.classList.remove('text-slate-500');
                registerBtn.classList.add('text-slate-800');
                loginBtn.classList.add('text-slate-500');
                loginBtn.classList.remove('text-slate-800');
            }
        }

        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-100', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-100');

            if (isError) {
                msg.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100');
            } else {
                msg.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('Please fill in all fields', true);
                return;
            }

            // Simulate loading
            const btn = document.querySelector('#loginForm button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">Signing in...</span>';
            btn.disabled = true;

            try {
                const response = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/';
                } else {
                    showMessage('Invalid credentials. Please try again.', true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Connection error. Please try again.', true);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function register() {
            const firstName = document.getElementById('registerFirstName').value.trim();
            const lastName = document.getElementById('registerLastName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            if (!firstName || !lastName || !email || !password || !passwordConfirm) {
                showMessage('Please fill in all fields', true);
                return;
            }

            if (password !== passwordConfirm) {
                showMessage('Passwords do not match', true);
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', true);
                return;
            }

            // Simulate loading
            const btn = document.querySelector('#registerForm button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">Creating Account...</span>';
            btn.disabled = true;


            try {
                const response = await fetch('http://localhost:8080/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    showMessage('Registration successful! Redirecting...');
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    const data = await response.json();
                    showMessage(data.detail || 'Error registering', true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Registration error:', error);
                showMessage('Connection error. Please try again.', true);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
</body>

</html>
